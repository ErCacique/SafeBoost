name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag a crear y publicar (p. ej. v0.1.0) sobre el commit de la rama elegida.
          Vacío = solo compilar y subir el artifact.
        type: string
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # crear el tag, el Release y subir assets

env:
  # Tag de la versión: el del push, o el indicado al lanzarlo a mano (vacío = sin publicar).
  # Con workflow_dispatch el tag lo crea action-gh-release: un tag subido con GITHUB_TOKEN no
  # dispararía este workflow otra vez, así que todo ocurre en esta misma ejecución.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: Compilar instalador y portable
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Instalar dependencias
        run: pip install -r requirements-build.txt pytest==9.2.0 jsonschema==4.26.0

      - name: Comprobar versión (tag = APP_VERSION = pyproject)
        if: env.RELEASE_TAG != ''
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "Tag no válido: $env:RELEASE_TAG (formato vX.Y.Z)"
            exit 1
          }
          $tag = $env:RELEASE_TAG.TrimStart('v')
          $app = python -c "from core.constants import APP_VERSION; print(APP_VERSION)"
          $proj = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $vi = (Select-String -Path packaging/version_info.txt -Pattern "'ProductVersion', '([^']+)'").Matches[0].Groups[1].Value
          if ($tag -ne $app -or $tag -ne $proj -or $tag -ne $vi) {
            Write-Error "Versiones distintas: tag=$tag APP_VERSION=$app pyproject=$proj version_info=$vi"
            exit 1
          }

      - name: Validar catálogo y tests
        run: |
          python scripts/validate_tweaks.py
          pytest -q

      - name: PyInstaller
        run: pyinstaller --clean --noconfirm packaging/SafeTrim.spec

      - name: Self-test del ejecutable (catálogo y handlers empaquetados)
        run: |
          $p = Start-Process dist/SafeTrim/SafeTrim.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Self-test falló (código $($p.ExitCode))"; exit 1 }

      - name: Versión
        id: ver
        run: |
          $v = python -c "from core.constants import APP_VERSION; print(APP_VERSION)"
          "version=$v" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Portable (.zip con portable.txt)
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $stage = "dist/portable/SafeTrim"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Recurse dist/SafeTrim/* $stage
          "Versión portable: los datos se guardan en la carpeta SafeTrimData junto al programa." |
            Out-File -Encoding utf8 "$stage/portable.txt"
          Compress-Archive -Path $stage -DestinationPath "dist/SafeTrim-portable-$v.zip" -Force

      - name: Instalador (Inno Setup)
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" packaging/SafeTrim.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC falló ($LASTEXITCODE)"; exit 1 }

      - name: SHA256
        id: hash
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $files = @("SafeTrim-Setup-$v.exe", "SafeTrim-portable-$v.zip")
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            "$h  $f"
          }
          $lines | Out-File -Encoding ascii dist/SHA256SUMS.txt
          $lines | ForEach-Object { Write-Host $_ }
          "setup=$(($lines[0] -split ' ')[0])" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          "portable=$(($lines[1] -split ' ')[0])" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Subir artifact
        uses: actions/upload-artifact@v7
        with:
          name: SafeTrim-${{ env.RELEASE_TAG || github.sha }}
          path: |
            dist/SafeTrim-Setup-*.exe
            dist/SafeTrim-portable-*.zip
            dist/SHA256SUMS.txt
          retention-days: 30

      - name: Publicar Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: SafeTrim ${{ env.RELEASE_TAG }}
          files: |
            dist/SafeTrim-Setup-*.exe
            dist/SafeTrim-portable-*.zip
            dist/SHA256SUMS.txt
          body: |
            **Instalador** (recomendado): `SafeTrim-Setup-${{ steps.ver.outputs.version }}.exe`
            SHA256: `${{ steps.hash.outputs.setup }}`

            **Portable** (USB / sin instalar; los datos se guardan junto al programa):
            `SafeTrim-portable-${{ steps.ver.outputs.version }}.zip`
            SHA256: `${{ steps.hash.outputs.portable }}`

            Verificar en PowerShell:
            ```powershell
            (Get-FileHash .\SafeTrim-Setup-${{ steps.ver.outputs.version }}.exe -Algorithm SHA256).Hash.ToLower()
            ```

            Cambios: ver [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ env.RELEASE_TAG }}/CHANGELOG.md).
