name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Tag a crear y publicar (p. ej. v0.1.0) sobre el commit de la rama elegida.
          Vacío = solo compilar y subir el artifact.
        type: string
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # crear el tag, el Release y subir assets

env:
  # Tag de la versión: el del push, o el indicado al lanzarlo a mano (vacío = sin publicar).
  # Con workflow_dispatch el tag lo crea action-gh-release: un tag subido con GITHUB_TOKEN no
  # dispararía este workflow otra vez, así que todo ocurre en esta misma ejecución.
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}

jobs:
  build:
    name: Compilar WinTune.exe
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Instalar dependencias
        run: pip install -r requirements-build.txt pytest==9.2.0 jsonschema==4.26.0

      - name: Comprobar versión (tag = APP_VERSION = pyproject)
        if: env.RELEASE_TAG != ''
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            Write-Error "Tag no válido: $env:RELEASE_TAG (formato vX.Y.Z)"
            exit 1
          }
          $tag = $env:RELEASE_TAG.TrimStart('v')
          $app = python -c "from core.constants import APP_VERSION; print(APP_VERSION)"
          $proj = python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])"
          $vi = (Select-String -Path packaging/version_info.txt -Pattern "'ProductVersion', '([^']+)'").Matches[0].Groups[1].Value
          if ($tag -ne $app -or $tag -ne $proj -or $tag -ne $vi) {
            Write-Error "Versiones distintas: tag=$tag APP_VERSION=$app pyproject=$proj version_info=$vi"
            exit 1
          }

      - name: Validar catálogo y tests
        run: |
          python scripts/validate_tweaks.py
          pytest -q

      - name: PyInstaller
        run: pyinstaller --clean --noconfirm packaging/WinTune.spec

      - name: Self-test del ejecutable (catálogo y handlers empaquetados)
        run: |
          $p = Start-Process dist/WinTune.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "Self-test falló (código $($p.ExitCode))"; exit 1 }

      - name: SHA256
        id: hash
        run: |
          $hash = (Get-FileHash dist/WinTune.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WinTune.exe" | Out-File -Encoding ascii dist/WinTune.exe.sha256
          "sha256=$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          Write-Host "SHA256: $hash"

      - name: Subir artifact
        uses: actions/upload-artifact@v7
        with:
          name: WinTune-${{ env.RELEASE_TAG || github.sha }}
          path: |
            dist/WinTune.exe
            dist/WinTune.exe.sha256
          retention-days: 30

      - name: Publicar Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: WinTune ${{ env.RELEASE_TAG }}
          files: |
            dist/WinTune.exe
            dist/WinTune.exe.sha256
          body: |
            **SHA256 (WinTune.exe):** `${{ steps.hash.outputs.sha256 }}`

            Verificar en PowerShell:
            ```powershell
            (Get-FileHash .\WinTune.exe -Algorithm SHA256).Hash.ToLower()
            ```

            Cambios: ver [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ env.RELEASE_TAG }}/CHANGELOG.md).
