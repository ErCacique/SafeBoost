name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# Un push nuevo a la misma rama cancela la ejecución anterior: ahorra minutos.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint, catálogo y tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks analiza el historial

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: Validar data/tweaks.json
        run: python scripts/validate_tweaks.py

      - name: Tipos (mypy)
        run: mypy

      - name: Tests (registro simulado) y cobertura
        run: pytest -m "not windows" --cov --cov-report=term

      - name: Humo de la interfaz (Xvfb)
        run: |
          sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a python scripts/ui_smoke.py --lang es
          xvfb-run -a python scripts/ui_smoke.py --lang en

      - name: Buscar secretos (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

  windows:
    name: Tests con winreg nativo (Windows)
    needs: lint-test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # pytest importa todos los módulos de tests al recolectar, aunque -m windows los
      # deseleccione después: test_catalog.py necesita jsonschema.
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest==9.2.0 jsonschema==4.26.0

      - name: Tests Windows
        run: pytest -m windows

  e2e:
    name: E2E aplicar y revertir (Windows real)
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest==9.2.0 jsonschema==4.26.0

      # El runner es una VM desechable con administrador: aquí sí se toca el sistema.
      - name: Aplicar y revertir tweaks reales
        env:
          SAFETRIM_E2E: "1"
          PYTHONUTF8: "1"  # tildes legibles en el log del runner
          SAFETRIM_HOME: ${{ runner.temp }}\safetrim
        run: pytest -m e2e -rA -s

  ui-windows:
    name: Interfaz en Windows (humo y capturas)
    needs: lint-test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recorrer todas las pantallas (demo)
        env:
          PYTHONUTF8: "1"
        run: |
          python scripts/ui_smoke.py --lang es --screenshots screenshots
          python scripts/ui_smoke.py --lang en --screenshots screenshots

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capturas-interfaz
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
