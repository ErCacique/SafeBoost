name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

# Un push nuevo a la misma rama cancela la ejecución anterior: ahorra minutos.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint, catálogo y tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # gitleaks analiza el historial

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: Validar data/tweaks.json
        run: python scripts/validate_tweaks.py

      - name: Tests (registro simulado)
        run: pytest -m "not windows"

      - name: Buscar secretos (gitleaks)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

  windows:
    name: Tests con winreg nativo (Windows)
    needs: lint-test
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # pytest importa todos los módulos de tests al recolectar, aunque -m windows los
      # deseleccione después: test_catalog.py necesita jsonschema.
      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest==9.2.0 jsonschema==4.26.0

      - name: Tests Windows
        run: pytest -m windows
