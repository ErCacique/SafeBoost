version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      # Un único PR semanal para parches y menores: menos ejecuciones de CI.
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      # CustomTkinter 6 es una versión mayor: se evalúa a mano.
      - dependency-name: customtkinter
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
